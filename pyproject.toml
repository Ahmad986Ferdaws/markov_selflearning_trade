[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markov-selflearning-trade"
version = "0.4.1"
description = "An honest, simulation-only daily evaluation harness — and the verified null result that the Markov regime model has no edge over persistence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["markov", "regime", "persistence-baseline", "walk-forward", "backtest", "null-result", "paper-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "anthropic>=2.3.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
regime-cli = "app.cli.regime:main"
compare-cli = "app.cli.compare:main"
evaluate-cli = "app.cli.evaluate:main"
diagnose-cli = "app.cli.diagnose:main"
kalman-cli = "kalman.cli:main"

[project.urls]
Homepage = "https://github.com/Ahmad986Ferdaws/markov_selflearning_trade"
Repository = "https://github.com/Ahmad986Ferdaws/markov_selflearning_trade"
Changelog = "https://github.com/Ahmad986Ferdaws/markov_selflearning_trade/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Ahmad986Ferdaws/markov_selflearning_trade/tree/main/docs"
Issues = "https://github.com/Ahmad986Ferdaws/markov_selflearning_trade/issues"

[tool.hatch.build.targets.wheel]
packages = ["app", "kalman"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio warns on every run until this is explicit; "function" is the
# scope the async tests already assume.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
# Formatting and target only; rule selection stays with the CI command line.
target-version = "py311"
line-length = 110
