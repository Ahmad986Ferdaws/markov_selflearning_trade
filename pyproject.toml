[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markov-selflearning-trade"
version = "0.1.0"
description = "An honest, simulation-only daily evaluation harness — and the verified null result that the Markov regime model has no edge over persistence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
regime-cli = "app.cli.regime:main"
compare-cli = "app.cli.compare:main"
evaluate-cli = "app.cli.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
