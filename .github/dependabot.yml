# Dependabot keeps the pinned lower bounds in pyproject.toml current. Minor and
# patch bumps are grouped into one PR a week so the inbox stays readable; a
# major bump arrives on its own so it can be judged alone.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
