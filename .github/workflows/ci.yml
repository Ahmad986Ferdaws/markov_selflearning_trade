name: tests

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the checkout; it never pushes, comments, or releases.
permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite and the determinism receipt finish in about two minutes; a
    # hung network call (yfinance is importable even though tests never use it)
    # should fail the run, not hold a runner for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test suite (fully offline — FakeProvider, pinned snapshots)
        run: python -m pytest -q
      - name: Determinism receipt — the null result must reproduce
        run: |
          python -m app.cli.evaluate | tee /tmp/eval.out
          grep -q "Model        hit-rate: 90.9%" /tmp/eval.out
          grep -q "Persistence  hit-rate: 90.9%" /tmp/eval.out
      - name: Independent re-derivation — zero app imports, from the raw snapshot
        run: python scripts/independent_rederivation.py
